plugins { id 'com.android.application' }

android {
    namespace 'com.shorthunter.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.shorthunter.app'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '2.0-realtime'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
