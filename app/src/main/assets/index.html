<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#172033}.head{background:#0f172a;color:#fff;padding:28px 18px 20px}.head h1{margin:0;font-size:26px}.head p{opacity:.72;margin:7px 0 0;font-size:13px}.wrap{padding:14px}.card{background:#fff;border-radius:17px;padding:16px;margin-bottom:13px;box-shadow:0 2px 12px #0000000c}textarea{width:100%;padding:13px;border:1px solid #d8dce5;border-radius:11px;font-size:16px;margin:10px 0;resize:vertical}button{width:100%;border:0;border-radius:11px;background:#d32f2f;color:#fff;font-size:17px;font-weight:700;padding:14px}.tag{display:inline-block;background:#fff0f0;color:#c62828;border-radius:20px;padding:5px 10px;margin:4px;font-size:13px}.muted{color:#697386;font-size:12px;line-height:1.6}.status{font-size:13px;margin-top:8px;color:#526071}.stock{border-top:1px solid #eef1f5;padding:13px 0}.stock:first-child{border-top:0}.row{display:flex;justify-content:space-between;gap:10px}.name{font-weight:750;font-size:17px}.score{font-weight:800}.up{color:#d32f2f}.down{color:#14804a}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:9px;font-size:13px}.pill{background:#f6f7f9;border-radius:9px;padding:7px}.good{background:#fff1f1;color:#bd2727}.warn{background:#fff8e8;color:#946500}.bad{background:#edf8f1;color:#147a43}.top{border:1.5px solid #ef9a9a;border-radius:13px;padding:12px;margin:10px 0;background:#fffafa}.small{font-size:11px;color:#7a8494}.loading{padding:20px;text-align:center;color:#6a7484}</style></head><body><div class="head"><h1>超短猎手 V2 · 实时版</h1><p>公开行情源 · 实时/准实时扫描 · 缩量站上10日线</p></div><div class="wrap"><div class="card"><b>候选股票</b><textarea id="stocks" rows="6" placeholder="每行一只，支持名称或6位代码"></textarea><button id="btn" onclick="scan(false)">开始实时扫描</button><div id="st" class="status">扫描后每30秒自动刷新一次。</div></div><div class="card"><b>策略条件</b><div><span class="tag">站上10日线</span><span class="tag">缩量</span><span class="tag">换手率3%~12%</span><span class="tag">主力净流入</span></div><p class="muted">现价、涨跌幅、成交量、成交额、换手率、主力净流入来自联网行情；10日线和缩量状态由实时行情+历史日K计算。题材热度暂不作为硬打分项。</p></div><div class="card" id="out"><b>扫描结果</b><p class="muted">输入候选股票后点击“开始实时扫描”。</p></div></div><script>
const pending={};let timer=null,lastList=[];
window.__nativeResult=(id,text)=>{if(pending[id]){const p=pending[id];delete pending[id];text.startsWith('__ERROR__')?p.reject(new Error(text)):p.resolve(text)}};
function nativeGet(url){return new Promise((resolve,reject)=>{const id='r'+Date.now()+Math.random().toString(36).slice(2);pending[id]={resolve,reject};if(!window.NativeMarket){reject(new Error('原生网络模块不可用'));return}NativeMarket.get(id,url);setTimeout(()=>{if(pending[id]){delete pending[id];reject(new Error('请求超时'))}},15000)})}
async function getJson(url){return JSON.parse(await nativeGet(url))}
function secidFromCode(c){return (/^(6|68)/.test(c)?'1.':'0.')+c}
async function resolveStock(q){q=q.trim();if(/^\d{6}$/.test(q))return {code:q,secid:secidFromCode(q),input:q};const u='https://searchapi.eastmoney.com/api/suggest/get?input='+encodeURIComponent(q)+'&type=14&token=D43BF722C8E33BDC906FB84D85E326E8';const j=await getJson(u);const arr=j?.QuotationCodeTable?.Data||[];const x=arr.find(v=>v.Code&&/^\d{6}$/.test(v.Code)&&['0','1'].includes(String(v.MktNum)))||arr.find(v=>v.Code&&/^\d{6}$/.test(v.Code));if(!x)throw new Error('未找到股票代码');const m=String(x.MktNum)==='1'?'1.':'0.';return {code:x.Code,secid:m+x.Code,input:q}}
function n(v,scale=1){v=Number(v);return Number.isFinite(v)?v/scale:null}
function fmtMoney(v){if(v==null)return'--';const a=Math.abs(v);return a>=1e8?(v/1e8).toFixed(2)+'亿':a>=1e4?(v/1e4).toFixed(0)+'万':v.toFixed(0)}
function chinaProgress(){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Shanghai',hour12:false,hour:'2-digit',minute:'2-digit',weekday:'short'}).formatToParts(new Date());let h=0,m=0,w='';for(const p of parts){if(p.type==='hour')h=+p.value;if(p.type==='minute')m=+p.value;if(p.type==='weekday')w=p.value}if(w==='Sat'||w==='Sun')return 1;const t=h*60+m;if(t<570)return 0;if(t<=690)return (t-570)/240;if(t<780)return 120/240;if(t<=900)return (120+t-780)/240;return 1}
async function analyze(q){const r=await resolveStock(q);const quoteUrl='https://push2.eastmoney.com/api/qt/stock/get?secid='+r.secid+'&fields=f43,f47,f48,f57,f58,f60,f62,f86,f116,f117,f168,f170,f184';const kUrl='https://push2his.eastmoney.com/api/qt/stock/kline/get?secid='+r.secid+'&klt=101&fqt=1&lmt=16&end=20500101&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61';const [qj,kj]=await Promise.all([getJson(quoteUrl),getJson(kUrl)]);const d=qj?.data;if(!d)throw new Error('行情返回为空');const price=n(d.f43,100),pct=n(d.f170,100),turn=n(d.f168,100),amount=n(d.f48),main=n(d.f62),mainRatio=n(d.f184,100),curVol=n(d.f47),ts=n(d.f86);const lines=(kj?.data?.klines||[]).map(s=>{const a=s.split(',');return {date:a[0],close:+a[2],vol:+a[5],turn:+a[10]}}).filter(x=>Number.isFinite(x.close));if(lines.length<10)throw new Error('历史K线不足');const quoteDate=ts?new Date(ts*1000).toLocaleDateString('sv-SE',{timeZone:'Asia/Shanghai'}):'';let hist=lines.slice();const latest=hist[hist.length-1];const latestIsToday=quoteDate&&latest&&latest.date===quoteDate;let maBase=latestIsToday?hist.slice(-10):hist.slice(-10);const ma10=maBase.reduce((s,x)=>s+x.close,0)/maBase.length;const prev=latestIsToday?hist[hist.length-2]:hist[hist.length-1];const prog=chinaProgress();let shrink=null,volRatio=null;if(prev&&curVol!=null&&prog>0){const expected=prev.vol*Math.max(prog,.10);volRatio=curVol/expected;shrink=volRatio<0.92}const above=price!=null&&price>=ma10;let score=0;if(above)score+=35;if(shrink===true)score+=25;if(turn!=null&&turn>=3&&turn<=12)score+=15;if(main!=null&&main>0)score+=15;if(pct!=null&&pct>=-2&&pct<=6)score+=10;score=Math.min(100,score);let action=above&&shrink===true&&turn>=3&&turn<=12?'尾盘重点观察':!above?'暂不符合：未站上10日线':shrink===false?'等待缩量':'继续观察';return {input:q,name:d.f58||q,code:d.f57||r.code,price,pct,turn,amount,main,mainRatio,ma10,above,shrink,volRatio,score,action}}
function cls(v){return v==null?'':v>=0?'up':'down'}
function render(arr){arr.sort((a,b)=>(b.score||0)-(a.score||0));const o=document.getElementById('out');const ok=arr.filter(x=>!x.error);let html='<b>实时扫描结果</b>';if(ok.length){html+='<div class="small">按策略分数排序；TOP 1~2 仅表示当前条件匹配度，不保证上涨。</div>';ok.forEach((x,i)=>{const top=i<2?'top':'stock';html+='<div class="'+top+'"><div class="row"><div><span class="name">'+x.name+'</span> <span class="small">'+x.code+'</span></div><div class="score">'+x.score+'分</div></div><div class="row"><div class="'+cls(x.pct)+'">'+(x.price?.toFixed(2)||'--')+'　'+(x.pct==null?'--':(x.pct>=0?'+':'')+x.pct.toFixed(2)+'%')+'</div><div>'+x.action+'</div></div><div class="metrics"><div class="pill '+(x.above?'good':'bad')+'">10日线 '+x.ma10.toFixed(2)+' · '+(x.above?'已站上':'未站上')+'</div><div class="pill '+(x.shrink===true?'good':x.shrink===false?'warn':'')+'">量能 '+(x.shrink===true?'缩量':x.shrink===false?'未缩量':'待确认')+(x.volRatio!=null?' '+x.volRatio.toFixed(2)+'x':'')+'</div><div class="pill">换手率 '+(x.turn==null?'--':x.turn.toFixed(2)+'%')+'</div><div class="pill">成交额 '+fmtMoney(x.amount)+'</div><div class="pill '+(x.main>0?'good':x.main<0?'bad':'')+'">主力净流入 '+fmtMoney(x.main)+'</div><div class="pill">主力占比 '+(x.mainRatio==null?'--':x.mainRatio.toFixed(2)+'%')+'</div></div></div>'})}const errs=arr.filter(x=>x.error);if(errs.length)html+='<div class="stock"><b>未成功读取</b><br>'+errs.map(x=>x.input+'：'+x.error).join('<br>')+'</div>';o.innerHTML=html}
async function scan(auto){let a;if(auto)a=lastList;else{a=document.getElementById('stocks').value.split(/\n|,|，/).map(x=>x.trim()).filter(Boolean);lastList=a}if(!a.length){document.getElementById('out').innerHTML='<b>扫描结果</b><p>请先输入候选股票。</p>';return}document.getElementById('btn').disabled=true;document.getElementById('st').textContent=(auto?'自动刷新中…':'正在联网读取实时行情…')+' 共 '+a.length+' 只';document.getElementById('out').innerHTML='<div class="loading">正在读取实时行情和历史K线…</div>';const res=[];for(let i=0;i<a.length;i++){document.getElementById('st').textContent='正在扫描 '+(i+1)+'/'+a.length+'：'+a[i];try{res.push(await analyze(a[i]))}catch(e){res.push({input:a[i],error:e.message})}}render(res);document.getElementById('btn').disabled=false;document.getElementById('st').textContent='最后刷新：'+new Date().toLocaleTimeString()+' · 30秒后自动刷新';clearTimeout(timer);timer=setTimeout(()=>scan(true),30000)}
</script></body></html>
