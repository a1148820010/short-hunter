<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>
*{box-sizing:border-box}html,body{margin:0;background:#071321;color:#e8eef8;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.app{min-height:100vh;padding-bottom:72px}.top{padding:18px 16px 10px;background:linear-gradient(180deg,#0a1728,#081423);position:sticky;top:0;z-index:10;border-bottom:1px solid #15263c}.brand{display:flex;align-items:center;justify-content:space-between}.brand h1{margin:0;font-size:26px;letter-spacing:.5px}.brand p{margin:4px 0 0;color:#8ea0b7;font-size:12px}.gear{font-size:24px}.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}.quick div{background:#12223a;border:1px solid #1b3150;border-radius:9px;padding:10px 4px;text-align:center;font-size:12px}.quick .on{background:#ff394c;color:#fff;border-color:#ff394c}.wrap{padding:12px}.panel{background:linear-gradient(180deg,#0f1e31,#0b1a2c);border:1px solid #1d3450;border-radius:13px;margin-bottom:11px;overflow:hidden}.panel h3{margin:0;padding:13px 14px;border-bottom:1px solid #1b304a;font-size:16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}.candidate,.strategy{padding:13px}.sub{color:#8fa2b9;font-size:11px}textarea{width:100%;height:138px;margin-top:8px;background:#091625;border:1px solid #2a4262;color:#eef5ff;border-radius:9px;padding:12px;font-size:15px;resize:none}button{border:0;border-radius:8px;font-weight:700}.scan{width:100%;padding:13px;background:linear-gradient(90deg,#ff4053,#ff3b4a);color:#fff;font-size:16px;margin-top:10px}.scan:disabled{opacity:.55}.cond{display:flex;align-items:center;gap:8px;background:#0b192a;border:1px solid #203956;border-radius:8px;padding:9px;margin:7px 0;font-size:13px}.check{width:19px;height:19px;border-radius:5px;background:#2874ff;display:grid;place-items:center;color:#fff;font-size:12px}.status{margin-top:8px;color:#8da0b6;font-size:11px}.results{padding:0 8px 8px}.resultRow{display:grid;grid-template-columns:1.35fr .75fr .75fr .8fr .9fr .85fr .68fr;gap:6px;align-items:center;padding:10px 7px;border-bottom:1px solid #182c45;font-size:11px}.resultRow.head{color:#8396ae;font-size:10px;padding-top:8px}.resultRow.pick{background:linear-gradient(90deg,#4b2030aa,#321d2a55);border-left:3px solid #ff4556}.name{font-size:13px;font-weight:700}.code{font-size:10px;color:#8294a9}.up{color:#ff4d5e}.down{color:#18d07e}.neutral{color:#d5deea}.score{color:#ffc94d;font-weight:800}.view{background:#ff3b4d;color:white;padding:6px 7px;font-size:10px}.tag{display:inline-block;padding:4px 7px;border-radius:8px;background:#182a43;color:#b8c6d8;font-size:10px;margin:2px}.detail{display:none}.detail.show{display:block}.stockTop{display:grid;grid-template-columns:.9fr 1.6fr;gap:10px;padding:12px}.price{font-size:29px;font-weight:800;margin:6px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;font-size:11px;color:#b8c5d6}.stats div{display:flex;justify-content:space-between;border-bottom:1px dashed #1b3048;padding:3px 0}.chartWrap{padding:10px}.tabs{display:flex;background:#0a1726;border:1px solid #1c334d;border-radius:8px;overflow:hidden;margin-bottom:8px}.tabs span{flex:1;text-align:center;padding:8px;font-size:11px;color:#879ab1}.tabs .active{color:#ff4d5e;border-bottom:2px solid #ff4d5e;background:#0e1d31}canvas{width:100%;background:#081522;border-radius:8px;border:1px solid #172b43;display:block}.bottom3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:0 12px 12px}.mini{background:#0a1828;border:1px solid #1a3049;border-radius:10px;padding:10px;min-height:105px}.mini b{font-size:13px}.barRow{display:flex;align-items:end;gap:5px;height:58px;margin-top:7px}.bar{flex:1;border-radius:3px 3px 0 0;background:#24456d;min-height:6px}.bar.pos{background:#ff4b5c}.bar.neg{background:#1bc77a}.sig{font-size:11px;line-height:1.75}.sig .yes{color:#35d88d}.sig .no{color:#ffbf3f}.err{padding:12px;color:#ffb2b9;font-size:12px}.loading{padding:20px;text-align:center;color:#8fa2b9}.nav{position:fixed;bottom:0;left:0;right:0;height:62px;background:#081421eF;border-top:1px solid #1d3148;display:grid;grid-template-columns:repeat(5,1fr);z-index:20}.nav div{display:grid;place-items:center;font-size:11px;color:#a8b5c5}.nav .active{color:#ff4557}.footnote{font-size:10px;color:#6f8299;padding:0 12px 12px}@media(max-width:760px){.quick{grid-template-columns:repeat(3,1fr)}.quick div:nth-child(n+4){display:none}.grid2{grid-template-columns:1fr}.resultRow{grid-template-columns:1.3fr .8fr .78fr .82fr .72fr}.resultRow>*:nth-child(5),.resultRow>*:nth-child(6){display:none}.stockTop{grid-template-columns:1fr}.bottom3{grid-template-columns:1fr}.brand h1{font-size:24px}}
</style></head><body><div class="app"><div class="top"><div class="brand"><div><h1>🎯 超短猎手 V3</h1><p>快 · 准 · 稳｜缩量站上10日线 · 次日反弹策略</p></div><div class="gear">⚙️</div></div><div class="quick"><div class="on">🔎 实时扫描</div><div>📋 自选分析</div><div>🔥 市场热点</div><div>📊 涨停监控</div><div>💰 资金流向</div></div></div><div class="wrap"><div class="grid2"><div class="panel"><div class="candidate"><b>候选股票 <span class="sub">（最多20只）</span></b><textarea id="stocks" placeholder="每行输入1只股票，例如：\n青山纸业\n长安汽车\n金龙汽车"></textarea><button id="btn" class="scan" onclick="scan(false)">▶ 开始实时扫描</button><div id="st" class="status">扫描后每30秒自动刷新</div></div></div><div class="panel"><div class="strategy"><b>策略条件 <span class="sub">（当前固定）</span></b><div class="cond"><span class="check">✓</span>站上10日线</div><div class="cond"><span class="check">✓</span>缩量（较前一交易日）</div><div class="cond"><span class="check">✓</span>换手率 3% ~ 12%</div><div class="cond"><span class="check">✓</span>主力资金净流入</div><div class="cond"><span class="check">✓</span>涨跌幅 -2% ~ +6%</div></div></div></div><div class="panel"><h3>扫描结果 <span class="sub" id="sum">等待扫描</span></h3><div id="out" class="results"><div class="loading">输入候选股票后点击“开始实时扫描”</div></div></div><div class="panel detail" id="detail"><h3 id="dtitle">个股详情</h3><div class="stockTop"><div><div id="dtags"></div><div id="dprice" class="price">--</div><div id="dtime" class="sub">--</div><div class="stats" id="dstats"></div></div><div class="chartWrap"><div class="tabs"><span>分时</span><span class="active">日K</span><span>周K</span><span>月K</span></div><canvas id="kline" width="900" height="340"></canvas></div></div><div class="bottom3"><div class="mini"><b>资金方向（近5日）</b><div class="barRow" id="fundbars"></div></div><div class="mini"><b>技术信号</b><div class="sig" id="signals"></div></div><div class="mini"><b>策略结论</b><div class="sig" id="advice"></div></div></div><div class="footnote">数据仅供策略研究与行情展示，不构成投资建议。</div></div></div><div class="nav"><div class="active">🏠<br>首页</div><div>⭐<br>自选</div><div>📶<br>行情</div><div>📰<br>资讯</div><div>👤<br>我的</div></div></div><script>
const pending={};let timer=null,lastList=[],lastData=[];
window.__nativeResult=(id,text)=>{if(pending[id]){const p=pending[id];delete pending[id];text.startsWith('__ERROR__')?p.reject(new Error(text.replace('__ERROR__',''))):p.resolve(text)}};
function nativeGet(url){return new Promise((resolve,reject)=>{const id='r'+Date.now()+Math.random().toString(36).slice(2);pending[id]={resolve,reject};if(!window.NativeMarket){reject(new Error('原生网络模块不可用'));return}NativeMarket.get(id,url);setTimeout(()=>{if(pending[id]){delete pending[id];reject(new Error('请求超时，请检查网络/VPN'))}},22000)})}
async function getJson(url){const t=await nativeGet(url);return JSON.parse(t)}
function secidFromCode(c){return (/^(6|68)/.test(c)?'1.':'0.')+c}
async function resolveStock(q){q=q.trim();if(/^\d{6}$/.test(q))return{code:q,secid:secidFromCode(q),input:q};const u='https://searchapi.eastmoney.com/api/suggest/get?input='+encodeURIComponent(q)+'&type=14&token=D43BF722C8E33BDC906FB84D85E326E8';const j=await getJson(u),a=j?.QuotationCodeTable?.Data||[];const x=a.find(v=>v.Code&&/^\d{6}$/.test(v.Code)&&['0','1'].includes(String(v.MktNum)))||a[0];if(!x)throw new Error('未找到股票代码');return{code:x.Code,secid:(String(x.MktNum)==='1'?'1.':'0.')+x.Code,input:q}}
function n(v,s=1){v=Number(v);return Number.isFinite(v)?v/s:null}function fm(v){if(v==null)return'--';let a=Math.abs(v);return a>=1e8?(v/1e8).toFixed(2)+'亿':a>=1e4?(v/1e4).toFixed(0)+'万':v.toFixed(0)}
function chinaProgress(){const p=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Shanghai',hour12:false,hour:'2-digit',minute:'2-digit',weekday:'short'}).formatToParts(new Date());let h=0,m=0,w='';p.forEach(x=>{if(x.type==='hour')h=+x.value;if(x.type==='minute')m=+x.value;if(x.type==='weekday')w=x.value});if(w==='Sat'||w==='Sun')return 1;const t=h*60+m;if(t<570)return 0;if(t<=690)return(t-570)/240;if(t<780)return .5;if(t<=900)return(120+t-780)/240;return 1}
async function analyze(q){const r=await resolveStock(q);const quote='https://push2.eastmoney.com/api/qt/stock/get?secid='+r.secid+'&fields=f43,f44,f45,f46,f47,f48,f57,f58,f60,f62,f86,f116,f117,f168,f170,f184';const kurl='https://push2his.eastmoney.com/api/qt/stock/kline/get?secid='+r.secid+'&klt=101&fqt=1&lmt=45&end=20500101&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61';const [qj,kj]=await Promise.all([getJson(quote),getJson(kurl)]);const d=qj?.data;if(!d)throw new Error('行情返回为空');const lines=(kj?.data?.klines||[]).map(s=>{const a=s.split(',');return{date:a[0],open:+a[1],close:+a[2],high:+a[3],low:+a[4],vol:+a[5],amount:+a[6],pct:+a[8],turn:+a[10]}}).filter(x=>Number.isFinite(x.close));if(lines.length<10)throw new Error('历史K线不足');const price=n(d.f43,100),pct=n(d.f170,100),turn=n(d.f168,100),amount=n(d.f48),main=n(d.f62),mainRatio=n(d.f184,100),curVol=n(d.f47),ma10=lines.slice(-10).reduce((s,x)=>s+x.close,0)/10,ma5=lines.slice(-5).reduce((s,x)=>s+x.close,0)/5,prev=lines[lines.length-2]||lines[lines.length-1],prog=chinaProgress();let vr=null,shrink=null;if(prev&&curVol!=null&&prog>0){vr=curVol/(prev.vol*Math.max(.12,prog));shrink=vr<.92}const above=price>=ma10;let score=(above?35:0)+(shrink===true?25:0)+(turn>=3&&turn<=12?15:0)+(main>0?15:0)+(pct>=-2&&pct<=6?10:0);score=Math.max(0,Math.min(100,score));return{input:q,name:d.f58||q,code:d.f57||r.code,price,pct,turn,amount,main,mainRatio,totalCap:n(d.f116),floatCap:n(d.f117),open:n(d.f46,100),high:n(d.f44,100),low:n(d.f45,100),pre:n(d.f60,100),ma5,ma10,above,shrink,vr,score,lines,time:d.f86?new Date(d.f86*1000):new Date(),action:above&&shrink===true&&turn>=3&&turn<=12?'尾盘重点观察':!above?'未站上10日线':shrink===false?'等待缩量':'继续观察'}}
function cls(v){return v==null?'neutral':v>=0?'up':'down'}
function render(a){lastData=a.filter(x=>!x.error).sort((x,y)=>y.score-x.score);document.getElementById('sum').textContent='共 '+a.length+' 只，成功 '+lastData.length+' 只';let h='<div class="resultRow head"><div>股票</div><div>现价</div><div>涨跌</div><div>换手</div><div>主力</div><div>10日线</div><div>操作</div></div>';lastData.forEach((x,i)=>{h+='<div class="resultRow '+(i<2?'pick':'')+'"><div><div class="name">'+(i===0?'👑 ':'')+x.name+'</div><div class="code">'+x.code+' · '+x.score+'分</div></div><div class="'+cls(x.pct)+'">'+x.price.toFixed(2)+'</div><div class="'+cls(x.pct)+'">'+(x.pct>=0?'+':'')+x.pct.toFixed(2)+'%</div><div>'+x.turn.toFixed(2)+'%</div><div class="'+cls(x.main)+'">'+fm(x.main)+'</div><div>'+x.ma10.toFixed(2)+'</div><div><button class="view" onclick="showDetail('+i+')">查看</button></div></div>'});a.filter(x=>x.error).forEach(x=>h+='<div class="err">'+x.input+'：'+x.error+'</div>');document.getElementById('out').innerHTML=h}
function showDetail(i){const x=lastData[i];if(!x)return;document.getElementById('detail').classList.add('show');document.getElementById('dtitle').textContent=x.name+'  '+x.code;document.getElementById('dtags').innerHTML='<span class="tag">评分 '+x.score+'</span><span class="tag">'+(x.above?'站上10日线':'未站上10日线')+'</span><span class="tag">'+(x.shrink===true?'缩量':x.shrink===false?'未缩量':'量能待确认')+'</span>';document.getElementById('dprice').className='price '+cls(x.pct);document.getElementById('dprice').textContent=x.price.toFixed(2)+'  '+(x.pct>=0?'+':'')+x.pct.toFixed(2)+'%';document.getElementById('dtime').textContent=x.time.toLocaleString();const s=[['今开',x.open?.toFixed(2)],['最高',x.high?.toFixed(2)],['最低',x.low?.toFixed(2)],['昨收',x.pre?.toFixed(2)],['换手率',x.turn.toFixed(2)+'%'],['成交额',fm(x.amount)],['总市值',fm(x.totalCap)],['流通市值',fm(x.floatCap)],['主力净流入',fm(x.main)],['主力占比',x.mainRatio?.toFixed(2)+'%'],['MA5',x.ma5.toFixed(2)],['MA10',x.ma10.toFixed(2)],['量能比',x.vr==null?'--':x.vr.toFixed(2)+'x'],['策略评分',x.score+'分']];document.getElementById('dstats').innerHTML=s.map(v=>'<div><span>'+v[0]+'</span><b>'+v[1]+'</b></div>').join('');document.getElementById('signals').innerHTML='<div class="'+(x.above?'yes':'no')+'">● '+(x.above?'股价站上10日线':'股价未站上10日线')+'</div><div class="'+(x.shrink===true?'yes':'no')+'">● '+(x.shrink===true?'当前缩量':'当前未确认缩量')+'</div><div class="'+(x.turn>=3&&x.turn<=12?'yes':'no')+'">● 换手率 '+x.turn.toFixed(2)+'%</div><div class="'+(x.main>0?'yes':'no')+'">● 主力净流入 '+fm(x.main)+'</div>';document.getElementById('advice').innerHTML='<b style="color:#ffc94d">'+x.action+'</b><br>当前策略匹配度 '+x.score+' 分。<br>重点关注：10日线、量能、主力方向。';drawK(x.lines);drawFunds(x);document.getElementById('detail').scrollIntoView({behavior:'smooth'})}
function drawFunds(x){let vals=x.lines.slice(-5).map((k,i)=>((k.close-k.open)/Math.max(k.open,.01))*k.amount*.08);vals[4]=x.main||vals[4];const m=Math.max(...vals.map(v=>Math.abs(v)),1);document.getElementById('fundbars').innerHTML=vals.map(v=>'<div class="bar '+(v>=0?'pos':'neg')+'" style="height:'+Math.max(8,Math.abs(v)/m*55)+'px" title="'+fm(v)+'"></div>').join('')}
function drawK(lines){const c=document.getElementById('kline'),ctx=c.getContext('2d'),W=c.width,H=c.height;ctx.clearRect(0,0,W,H);ctx.fillStyle='#081522';ctx.fillRect(0,0,W,H);const data=lines.slice(-30),pad=38,volH=78,kH=H-volH-pad-14,max=Math.max(...data.map(x=>x.high)),min=Math.min(...data.map(x=>x.low)),vmax=Math.max(...data.map(x=>x.vol));ctx.strokeStyle='#17304a';ctx.lineWidth=1;for(let i=0;i<5;i++){let y=pad+i*(kH-pad)/4;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}const step=(W-18)/data.length,body=Math.max(3,step*.55);const y=p=>pad+(max-p)/(max-min||1)*(kH-pad);data.forEach((d,i)=>{let x=10+i*step+step/2,up=d.close>=d.open,col=up?'#ff4b5c':'#18cd80';ctx.strokeStyle=col;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x,y(d.high));ctx.lineTo(x,y(d.low));ctx.stroke();let yo=y(d.open),yc=y(d.close),top=Math.min(yo,yc),hh=Math.max(2,Math.abs(yc-yo));ctx.fillRect(x-body/2,top,body,hh);let vh=d.vol/vmax*(volH-14);ctx.fillRect(x-body/2,H-vh-8,body,vh)});function ma(n,col){ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();data.forEach((d,i)=>{let idx=lines.indexOf(d),seg=lines.slice(Math.max(0,idx-n+1),idx+1),v=seg.reduce((s,k)=>s+k.close,0)/seg.length,x=10+i*step+step/2,yy=y(v);i?ctx.lineTo(x,yy):ctx.moveTo(x,yy)});ctx.stroke()}ma(5,'#d7d760');ma(10,'#ff9a3c');ctx.fillStyle='#9fb0c4';ctx.font='20px sans-serif';ctx.fillText('MA5',12,22);ctx.fillStyle='#ff9a3c';ctx.fillText('  MA10',72,22)}
async function scan(auto){let a=auto?lastList:document.getElementById('stocks').value.split(/\n|,|，/).map(x=>x.trim()).filter(Boolean);if(!auto)lastList=a;if(!a.length)return;const b=document.getElementById('btn');b.disabled=true;document.getElementById('out').innerHTML='<div class="loading">正在读取实时行情与日K数据…</div>';let res=[];for(let i=0;i<a.length;i++){document.getElementById('st').textContent='扫描 '+(i+1)+'/'+a.length+'：'+a[i];try{res.push(await analyze(a[i]))}catch(e){res.push({input:a[i],error:e.message})}}render(res);b.disabled=false;document.getElementById('st').textContent='最后刷新：'+new Date().toLocaleTimeString()+' · 30秒后自动刷新';clearTimeout(timer);timer=setTimeout(()=>scan(true),30000)}
</script></body></html>
