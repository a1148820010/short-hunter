<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>body{margin:0;background:#f5f6fa;font-family:sans-serif;color:#172033}.head{background:#0f172a;color:white;padding:34px 20px 22px}.head h1{margin:0;font-size:27px}.head p{opacity:.72;margin:8px 0 0}.wrap{padding:16px}.card{background:white;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px #00000010}textarea,input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #d8dce5;border-radius:10px;font-size:16px;margin:8px 0}button{width:100%;border:0;border-radius:11px;background:#d32f2f;color:white;font-size:17px;font-weight:bold;padding:14px;margin-top:8px}.tag{display:inline-block;background:#fff0f0;color:#c62828;border-radius:20px;padding:5px 10px;margin:4px;font-size:13px}.muted{color:#697386;font-size:13px}.result{line-height:1.8}</style></head><body><div class="head"><h1>超短猎手</h1><p>尾盘选股 · 缩量站上10日线 · 次日反弹策略</p></div><div class="wrap"><div class="card"><b>候选股票</b><textarea id="stocks" rows="7" placeholder="每行输入一只股票，例如：\n深粮控股\n供销大集\n西安饮食"></textarea><button onclick="scan()">开始超短扫描</button></div><div class="card"><b>策略条件</b><div><span class="tag">站上10日线</span><span class="tag">缩量</span><span class="tag">换手率</span><span class="tag">资金方向</span><span class="tag">近期题材</span></div><p class="muted">当前版本先提供手机端策略工作台；实时行情接口将在配置数据源后启用。</p></div><div class="card result" id="out"><b>扫描结果</b><p class="muted">输入候选股票后点击“开始超短扫描”。</p></div></div><script>function scan(){let a=document.getElementById('stocks').value.split(/\n|,|，/).map(x=>x.trim()).filter(Boolean);let o=document.getElementById('out');if(!a.length){o.innerHTML='<b>扫描结果</b><p>请先输入候选股票。</p>';return}o.innerHTML='<b>已载入 '+a.length+' 只候选股</b><p>'+a.map(x=>'• '+x).join('<br>')+'</p><p class="muted">下一步接入实时行情后，这里会自动计算10日线、量比、换手率、资金和题材评分，并输出TOP 1～2。</p>'}</script></body></html>
