<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>超短猎手 4.2</title><style>*{box-sizing:border-box}html,body{margin:0;background:#f4f6f8;color:#17191d;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.app{min-height:100vh;padding-bottom:26px}.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.98);border-bottom:1px solid #e8ebef;padding:13px 14px 11px;backdrop-filter:blur(12px)}.brand{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.title{font-size:23px;font-weight:950;letter-spacing:.1px}.sub{font-size:11px;color:#8b9098;margin-top:3px}.sourceBox{text-align:right}.source{display:inline-flex;align-items:center;gap:5px;font-size:10px;padding:6px 8px;border-radius:999px;background:#edf6ff;color:#2468d8;font-weight:700}.led{width:7px;height:7px;border-radius:50%;background:#20a464}.source.warn{background:#fff4df;color:#9b6500}.source.warn .led{background:#e08a00}.source.bad{background:#fdecec;color:#bb2e27}.source.bad .led{background:#d93025}.lag{font-size:9px;color:#a0a5ad;margin-top:4px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.tab{border:0;border-radius:11px;padding:10px 4px;background:#f1f3f5;color:#60666f;font-size:12px;font-weight:700}.tab.on{background:#17191d;color:#fff}.wrap{padding:12px}.card{background:#fff;border:1px solid #e9ecf0;border-radius:18px;margin-bottom:12px;overflow:hidden;box-shadow:0 5px 18px rgba(25,35,45,.045)}.head{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-bottom:1px solid #f0f2f4}.head b{font-size:15px}.body{padding:13px 14px}.input{width:100%;height:118px;border:1px solid #dfe3e8;border-radius:14px;padding:12px;font-size:15px;resize:none;outline:none;background:#fafbfc;line-height:1.5}.input:focus{background:#fff;border-color:#8d939c}.row{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:12px 11px;font-size:13px;font-weight:850}.primary{flex:1;min-width:150px;background:#17191d;color:#fff}.ghost{background:#fff;border:1px solid #dfe3e8;color:#343942}.btn:disabled{opacity:.5}.status{display:flex;justify-content:space-between;gap:8px;margin-top:9px;font-size:10px;color:#969ba4}.health{margin-top:10px;background:#fafbfc;border:1px solid #eef0f3;border-radius:12px;padding:9px 10px;font-size:10px;color:#686e77;line-height:1.55}.health b{color:#252a30}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{background:#fafbfc;border:1px solid #eef0f3;border-radius:13px;padding:10px}.v{font-size:18px;font-weight:950}.k{font-size:10px;color:#9298a2;margin-top:3px}.result{padding:12px;border-bottom:1px solid #f0f1f4}.result:last-child{border-bottom:0}.rTop{display:grid;grid-template-columns:1.3fr .82fr .7fr;gap:8px;align-items:center}.name{font-weight:950;font-size:15px}.code{font-size:10px;color:#989da6;margin-top:2px}.score{text-align:right;font-size:18px;font-weight:950}.price{text-align:right;font-weight:850}.up{color:#d93025}.down{color:#159447}.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.chip{font-size:10px;padding:4px 7px;border-radius:999px;background:#f2f3f5;color:#5c626b}.ok{background:#eaf8ef;color:#178346}.warn{background:#fff4df;color:#a66000}.bad{background:#fdecec;color:#c8332b}.reason{font-size:11px;color:#5d636d;line-height:1.6;margin-top:8px}.signalLine{margin-top:7px;padding:8px 9px;border-radius:10px;background:#fafbfc;border:1px solid #eef0f3;font-size:10px;line-height:1.55;color:#696f78}.actions{display:flex;gap:7px;margin-top:9px}.mini{border:1px solid #dfe3e8;background:#fff;border-radius:10px;padding:8px 10px;font-size:11px;font-weight:700}.empty{text-align:center;color:#9ca1aa;font-size:12px;padding:28px}.detail{display:none}.detail.show{display:block}.detailPrice{font-size:30px;font-weight:950;margin:8px 0}.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}.kv div{display:flex;justify-content:space-between;font-size:11px;border-bottom:1px dashed #eceef2;padding:5px 0}.sectionTitle{font-size:12px;font-weight:850;margin:13px 0 7px}.formula{font-size:10px;color:#777d86;line-height:1.7;background:#fafbfc;border:1px solid #eef0f3;border-radius:12px;padding:9px 10px;margin-top:10px}canvas{width:100%;height:245px;border:1px solid #eef0f3;border-radius:12px;background:white}.footer{font-size:9px;color:#a0a5ad;text-align:center;padding:5px 12px 0}@media(max-width:400px){.summary{grid-template-columns:repeat(2,1fr)}.row .ghost{flex:1}.title{font-size:21px}}</style></head><body><div class="app"><div class="top"><div class="brand"><div><div class="title">超短猎手 4.2</div><div class="sub">真实行情 · 双源校验 · 信号公式透明</div></div><div class="sourceBox"><span id="source" class="source"><span class="led"></span><span id="sourceText">等待行情</span></span><div id="lag" class="lag">--</div></div></div><div class="tabs"><button class="tab on" onclick="setView('all',this)">候选扫描</button><button class="tab" onclick="setView('close',this)">尾盘确认</button><button class="tab" onclick="setView('risk',this)">风险过滤</button><button class="tab" onclick="setView('watch',this)">自选股</button></div></div><div class="wrap"><div class="card"><div class="head"><b>候选股票</b><span class="sub">名称 / 6位代码 · 最多30只</span></div><div class="body"><textarea id="stocks" class="input" placeholder="每行一只，例如：\n常山北明\n粤传媒\n000716"></textarea><div class="row"><button id="scanBtn" class="btn primary" onclick="scan(false)">开始实时扫描</button><button class="btn ghost" onclick="refreshNow()">立即刷新</button><button class="btn ghost" onclick="clearAll()">清空</button></div><div class="status"><span id="statusText">等待扫描</span><span id="lastTime">--</span></div><div class="health"><b>数据质量：</b><span id="healthText">尚未检测</span><br><b>规则：</b>报价主源东方财富；腾讯行情作价格交叉校验。交易时段若报价过旧或双源偏差过大，会直接标记“数据异常”，不参与尾盘确认。</div></div></div><div class="card"><div class="head"><b>实时概况</b><span class="sub">15秒主动同步</span></div><div class="body summary"><div class="metric"><div id="mGood" class="v">0</div><div class="k">尾盘重点</div></div><div class="metric"><div id="mWait" class="v">0</div><div class="k">继续观察</div></div><div class="metric"><div id="mRisk" class="v">0</div><div class="k">风险过滤</div></div><div class="metric"><div id="mBadData" class="v">0</div><div class="k">数据异常</div></div></div></div><div class="card"><div class="head"><b id="listTitle">候选排名</b><span id="countText" class="sub">尚未扫描</span></div><div id="results"><div class="empty">输入候选股票后开始扫描</div></div></div><div id="detail" class="card detail"><div class="head"><b id="dTitle">个股详情</b><button class="mini" onclick="closeDetail()">关闭</button></div><div class="body"><div id="dTags" class="chips"></div><div id="dPrice" class="detailPrice">--</div><div id="dKv" class="kv"></div><div class="sectionTitle">日K · MA5 · MA10</div><canvas id="kline" width="900" height="490"></canvas><div id="dFormula" class="formula"></div></div></div><div class="footer">所有策略信号均由实时/历史行情计算生成，不使用随机数或占位数据；互联网公开行情不等同交易所 Level-2。</div></div></div><script>const pending={};let timer=null,lastData=[],currentView='all';let watch=JSON.parse(localStorage.getItem('shortHunterWatch')||'[]');window.__nativeResult=(id,text)=>{const p=pending[id];if(!p)return;delete pending[id];text.startsWith('__ERROR__')?p.reject(new Error(text.slice(9))):p.resolve(text)};function nativeGet(url){return new Promise((resolve,reject)=>{if(!window.NativeMarket)return reject(new Error('原生网络模块不可用'));const id='r'+Date.now()+Math.random().toString(36).slice(2);pending[id]={resolve,reject};NativeMarket.get(id,url);setTimeout(()=>{if(pending[id]){delete pending[id];reject(new Error('行情请求超时'))}},12000)})}async function getJson(url){return JSON.parse(await nativeGet(url))}function sid(c){return (/^(6|68)/.test(c)?'1.':'0.')+c}function txCode(c){return (/^(6|68)/.test(c)?'sh':'sz')+c}async function resolveStock(q){q=q.trim();if(/^\d{6}$/.test(q))return{code:q,secid:sid(q)};const j=await getJson('https://searchapi.eastmoney.com/api/suggest/get?input='+encodeURIComponent(q)+'&type=14&token=D43BF722C8E33BDC906FB84D85E326E8');const a=j?.QuotationCodeTable?.Data||[];const x=a.find(v=>/^\d{6}$/.test(v.Code||'')&&['0','1'].includes(String(v.MktNum)));if(!x)throw new Error('未找到股票');return{code:x.Code,secid:(String(x.MktNum)==='1'?'1.':'0.')+x.Code}}function n(v,d=1){v=Number(v);return Number.isFinite(v)?v/d:null}function f(v,d=2){return v==null?'--':Number(v).toFixed(d)}function money(v){if(v==null)return'--';const a=Math.abs(v);return a>=1e8?(v/1e8).toFixed(2)+'亿':a>=1e4?(v/1e4).toFixed(0)+'万':Math.round(v)+''}function marketInfo(){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Shanghai',hour12:false,hour:'2-digit',minute:'2-digit',weekday:'short'}).formatToParts(new Date());let h=0,m=0,w='';for(const x of parts){if(x.type==='hour')h=+x.value;if(x.type==='minute')m=+x.value;if(x.type==='weekday')w=x.value}const t=h*60+m,weekday=!['Sat','Sun'].includes(w),open=weekday&&((t>=570&&t<=690)||(t>=780&&t<=900));let progress=1;if(weekday){if(t<570)progress=0;else if(t<=690)progress=(t-570)/240;else if(t<780)progress=.5;else if(t<=900)progress=(120+t-780)/240;else progress=1}return{open,progress}}function riskA(lines,price,ma10){if(lines.length<6)return false;const x=lines.slice(-5),peak=Math.max(...x.map(k=>k.high)),drop=(peak-price)/peak*100,hard=x.filter(k=>k.pct<-5).length;return drop>12||hard>=2||price<ma10*.94}async function tencentPrice(code){try{const t=await nativeGet('https://qt.gtimg.cn/q='+txCode(code));const a=t.split('~');const p=Number(a[3]);return Number.isFinite(p)&&p>0?p:null}catch(e){return null}}function quoteQuality(primary,secondary,quoteTime){const mi=marketInfo();const age=Math.max(0,(Date.now()-quoteTime.getTime())/1000);const diff=secondary&&primary?Math.abs(primary-secondary)/primary*100:null;const stale=mi.open&&age>120;const divergent=diff!=null&&diff>0.8;return{age,diff,stale,divergent,valid:!stale&&!divergent,dual:secondary!=null}}async function analyze(q){const r=await resolveStock(q);const [qj,kj,tx]=await Promise.all([getJson('https://push2.eastmoney.com/api/qt/stock/get?secid='+r.secid+'&fields=f43,f44,f45,f46,f47,f48,f57,f58,f60,f62,f86,f116,f117,f168,f170,f184'),getJson('https://push2his.eastmoney.com/api/qt/stock/kline/get?secid='+r.secid+'&klt=101&fqt=1&lmt=60&end=20500101&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61'),tencentPrice(r.code)]);const d=qj?.data;if(!d)throw new Error('东方财富实时行情为空');const lines=(kj?.data?.klines||[]).map(t=>{const a=t.split(',');return{date:a[0],open:+a[1],close:+a[2],high:+a[3],low:+a[4],vol:+a[5],amount:+a[6],pct:+a[8],turn:+a[10]}}).filter(x=>Number.isFinite(x.close));if(lines.length<10)throw new Error('历史K线不足');const price=n(d.f43,100),pct=n(d.f170,100),turn=n(d.f168,100),main=n(d.f62),mainRatio=n(d.f184,100),curVol=n(d.f47),ma10=lines.slice(-10).reduce((s,x)=>s+x.close,0)/10,ma5=lines.slice(-5).reduce((s,x)=>s+x.close,0)/5,prev=lines.at(-2),mi=marketInfo(),p=mi.progress;const vr=prev&&p>0?curVol/(prev.vol*Math.max(.12,p)):null,shrink=vr!=null?vr<.92:null,above=price>=ma10,rST=/ST|退/.test(d.f58||''),rCap=n(d.f116)>2e11,rA=riskA(lines,price,ma10),qt=d.f86?new Date(d.f86*1000):new Date(),quality=quoteQuality(price,tx,qt);let score=(above?25:0)+(shrink?20:0)+(turn>=3&&turn<=12?15:0)+(main>0?20:0)+(pct>=-2&&pct<=6?10:0)+(price>=ma5?5:0)+(mainRatio>3?5:0)-(rST?40:0)-(rCap?10:0)-(rA?30:0);if(!quality.valid)score=0;score=Math.max(0,Math.min(100,score));const closeOK=quality.valid&&above&&shrink===true&&turn>=3&&turn<=12&&main>0&&!rST&&!rA;return{name:d.f58||q,code:d.f57||r.code,price,txPrice:tx,pct,turn,main,mainRatio,totalCap:n(d.f116),amount:n(d.f48),ma5,ma10,vr,shrink,above,rST,rCap,rA,score,closeOK,lines,quoteTime:qt,quality}}async function scan(auto){let list=document.getElementById('stocks').value.split(/\n|,|，/).map(x=>x.trim()).filter(Boolean).slice(0,30);if(currentView==='watch'&&!list.length)list=watch.slice();if(!list.length){document.getElementById('statusText').textContent='请先输入股票';return}const btn=document.getElementById('scanBtn');btn.disabled=true;document.getElementById('statusText').textContent=auto?'自动同步中…':'正在读取真实行情并交叉校验…';const out=[];for(const q of list){try{out.push(await analyze(q))}catch(e){out.push({name:q,code:'',error:e.message,score:0,quality:{valid:false}})}}lastData=out;render();btn.disabled=false;const ok=out.filter(x=>!x.error&&x.quality?.valid).length,dual=out.filter(x=>!x.error&&x.quality?.dual).length,bad=out.length-ok;document.getElementById('statusText').textContent='同步完成 · '+ok+'只数据有效';document.getElementById('lastTime').textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false});document.getElementById('healthText').textContent='有效 '+ok+'/'+out.length+'；双源校验 '+dual+'/'+out.length+'；异常 '+bad+'。';const src=document.getElementById('source'),st=document.getElementById('sourceText');src.className='source '+(bad?'warn':'');st.textContent=dual?'东方财富 + 腾讯校验':'东方财富单源';document.getElementById('lag').textContent='本地同步 '+new Date().toLocaleTimeString('zh-CN',{hour12:false});clearInterval(timer);timer=setInterval(()=>scan(true),15000)}function filtered(){if(currentView==='close')return lastData.filter(x=>!x.error&&x.closeOK);if(currentView==='risk')return lastData.filter(x=>!x.error&&(x.rST||x.rCap||x.rA||!x.quality?.valid));if(currentView==='watch')return lastData.filter(x=>watch.includes(x.code)||watch.includes(x.name));return lastData.filter(x=>!x.error).sort((a,b)=>b.score-a.score)}function render(){const good=lastData.filter(x=>x.closeOK).length,risk=lastData.filter(x=>!x.error&&(x.rST||x.rCap||x.rA)).length,bad=lastData.filter(x=>x.error||!x.quality?.valid).length;document.getElementById('mGood').textContent=good;document.getElementById('mRisk').textContent=risk;document.getElementById('mBadData').textContent=bad;document.getElementById('mWait').textContent=Math.max(0,lastData.length-good-risk-bad);const a=filtered();document.getElementById('countText').textContent='显示 '+a.length+' 只';if(!a.length){document.getElementById('results').innerHTML='<div class="empty">当前条件下没有股票</div>';return}document.getElementById('results').innerHTML=a.map(s=>{if(s.error)return'<div class="result"><b>'+s.name+'</b><div class="reason bad">数据读取失败：'+s.error+'</div></div>';const q=s.quality||{},chips=[q.valid?'<span class="chip ok">数据有效</span>':'<span class="chip bad">数据异常</span>',q.dual?'<span class="chip ok">双源已校验</span>':'<span class="chip warn">单源</span>',s.above?'<span class="chip ok">站上MA10</span>':'<span class="chip bad">未站MA10</span>',s.shrink===true?'<span class="chip ok">缩量</span>':s.shrink===false?'<span class="chip warn">未缩量</span>':'<span class="chip">缩量待确认</span>',s.main>0?'<span class="chip ok">主力净流入</span>':'<span class="chip warn">主力净流出</span>',s.rA?'<span class="chip bad">A杀风险</span>':'',s.rST?'<span class="chip bad">ST风险</span>':''].join('');const qtxt='报价年龄 '+Math.round(q.age||0)+'秒'+(q.diff!=null?' · 双源价差 '+f(q.diff,2)+'%':' · 腾讯校验未返回');return'<div class="result"><div class="rTop"><div><div class="name">'+s.name+'</div><div class="code">'+s.code+'</div></div><div class="price '+(s.pct>=0?'up':'down')+'">'+f(s.price)+'<br><span style="font-size:10px">'+(s.pct>=0?'+':'')+f(s.pct)+'%</span></div><div class="score">'+s.score+'分</div></div><div class="chips">'+chips+'</div><div class="reason">换手 '+f(s.turn)+'% · 主力 '+money(s.main)+' · MA10 '+f(s.ma10)+' · 量比估算 '+f(s.vr)+'</div><div class="signalLine">'+qtxt+'。尾盘确认 = 数据有效 ∧ 站上MA10 ∧ 缩量 ∧ 换手3%–12% ∧ 主力净流入 ∧ 非ST ∧ 非A杀结构。</div><div class="actions"><button class="mini" onclick="openDetail(\''+s.code+'\')">详情/K线</button><button class="mini" onclick="toggleWatch(\''+s.code+'\')">'+(watch.includes(s.code)?'取消自选':'加入自选')+'</button></div></div>'}).join('')}function setView(v,el){currentView=v;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));el.classList.add('on');document.getElementById('listTitle').textContent={all:'候选排名',close:'尾盘确认',risk:'风险过滤',watch:'自选股'}[v];if(v==='watch'&&!lastData.length&&watch.length){document.getElementById('stocks').value=watch.join('\n');scan(false)}else render()}function toggleWatch(code){const i=watch.indexOf(code);if(i>=0)watch.splice(i,1);else watch.push(code);localStorage.setItem('shortHunterWatch',JSON.stringify(watch));render()}function refreshNow(){if(lastData.length||document.getElementById('stocks').value.trim())scan(false);else document.getElementById('statusText').textContent='没有可刷新的股票'}function clearAll(){clearInterval(timer);document.getElementById('stocks').value='';lastData=[];document.getElementById('results').innerHTML='<div class="empty">已清空</div>';document.getElementById('statusText').textContent='等待扫描';document.getElementById('lastTime').textContent='--';document.getElementById('healthText').textContent='尚未检测';['mGood','mWait','mRisk','mBadData'].forEach(id=>document.getElementById(id).textContent='0');document.getElementById('sourceText').textContent='等待行情';document.getElementById('source').className='source';document.getElementById('lag').textContent='--';closeDetail()}function openDetail(code){const s=lastData.find(x=>x.code===code);if(!s)return;document.getElementById('detail').classList.add('show');document.getElementById('dTitle').textContent=s.name+' '+s.code;document.getElementById('dPrice').textContent=f(s.price)+'  '+(s.pct>=0?'+':'')+f(s.pct)+'%';const q=s.quality||{};document.getElementById('dTags').innerHTML='<span class="chip">东方财富 '+s.quoteTime.toLocaleTimeString('zh-CN',{hour12:false})+'</span>'+(s.txPrice?'<span class="chip ok">腾讯 '+f(s.txPrice)+'</span>':'<span class="chip warn">腾讯校验未返回</span>')+(q.valid?'<span class="chip ok">数据有效</span>':'<span class="chip bad">数据异常</span>');document.getElementById('dKv').innerHTML='<div><span>换手率</span><b>'+f(s.turn)+'%</b></div><div><span>主力净流入</span><b>'+money(s.main)+'</b></div><div><span>MA5</span><b>'+f(s.ma5)+'</b></div><div><span>MA10</span><b>'+f(s.ma10)+'</b></div><div><span>总市值</span><b>'+money(s.totalCap)+'</b></div><div><span>成交额</span><b>'+money(s.amount)+'</b></div><div><span>量比估算</span><b>'+f(s.vr)+'</b></div><div><span>双源价差</span><b>'+(q.diff==null?'--':f(q.diff,2)+'%')+'</b></div>';document.getElementById('dFormula').innerHTML='<b>信号计算：</b><br>MA5/MA10 = 最近5/10个交易日收盘价均值；缩量 = 当前成交量按交易进度折算后低于前一交易日92%；主力资金 = 东方财富 f62；换手率 = 东方财富 f168；风险结构 = 近5日高点回撤>12%，或近5日出现≥2个单日跌幅<-5%，或现价低于MA10的94%。<br><b>数据质量：</b>交易时段报价年龄>120秒，或东方财富与腾讯现价偏差>0.8%，该股票直接判为“数据异常”，不进入尾盘确认。';draw(s);document.getElementById('detail').scrollIntoView({behavior:'smooth'})}function closeDetail(){document.getElementById('detail').classList.remove('show')}function draw(s){const c=document.getElementById('kline'),x=c.getContext('2d'),d=s.lines.slice(-30);x.clearRect(0,0,c.width,c.height);const pad=40,w=c.width-pad*2,h=c.height-72,max=Math.max(...d.map(k=>k.high)),min=Math.min(...d.map(k=>k.low)),sx=w/d.length,py=v=>22+(max-v)/(max-min||1)*(h-44);x.strokeStyle='#edf0f3';for(let i=0;i<5;i++){const y=22+i*(h-44)/4;x.beginPath();x.moveTo(pad,y);x.lineTo(c.width-pad,y);x.stroke()}d.forEach((k,i)=>{const cx=pad+i*sx+sx/2,yo=py(k.open),yc=py(k.close),yh=py(k.high),yl=py(k.low);x.strokeStyle=k.close>=k.open?'#d93025':'#159447';x.beginPath();x.moveTo(cx,yh);x.lineTo(cx,yl);x.stroke();x.fillStyle=x.strokeStyle;x.fillRect(cx-sx*.22,Math.min(yo,yc),sx*.44,Math.max(2,Math.abs(yc-yo))) });function ma(period,color){x.strokeStyle=color;x.lineWidth=2;x.beginPath();for(let i=period-1;i<d.length;i++){const v=d.slice(i-period+1,i+1).reduce((a,b)=>a+b.close,0)/period,cx=pad+i*sx+sx/2,y=py(v);i===period-1?x.moveTo(cx,y):x.lineTo(cx,y)}x.stroke()}ma(5,'#e08a00');ma(10,'#2468d8');x.lineWidth=1}window.addEventListener('beforeunload',()=>clearInterval(timer));</script></body></html>
