<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>超短猎手</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#f5f6f8;color:#17191d;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.app{min-height:100vh;padding-bottom:82px}.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid #eceef2;padding:14px 14px 10px}.brand{display:flex;align-items:center;justify-content:space-between}.title{font-size:23px;font-weight:900;letter-spacing:.2px}.sub{font-size:11px;color:#8a8f99}.badge{font-size:11px;padding:5px 8px;border-radius:999px;background:#f0f6ff;color:#2468d8}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.tab{padding:9px 4px;border-radius:10px;background:#f5f6f8;text-align:center;font-size:12px;color:#656b75}.tab.on{background:#17191d;color:#fff}.wrap{padding:12px}.card{background:#fff;border:1px solid #eceef2;border-radius:16px;margin-bottom:12px;box-shadow:0 3px 16px rgba(20,30,50,.04);overflow:hidden}.cardHead{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-bottom:1px solid #f0f1f4}.cardHead b{font-size:15px}.body{padding:13px 14px}.input{width:100%;height:126px;border:1px solid #dfe3e8;border-radius:12px;padding:12px;font-size:15px;background:#fafbfc;resize:none;outline:none}.input:focus{border-color:#17191d;background:#fff}.row{display:flex;gap:9px;align-items:center}.primary{flex:1;border:0;background:#17191d;color:#fff;border-radius:12px;padding:13px 10px;font-size:15px;font-weight:800}.ghost{border:1px solid #dfe3e8;background:#fff;color:#343942;border-radius:12px;padding:13px 12px;font-size:13px}.muted{font-size:11px;color:#9499a3;line-height:1.6}.strategyGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rule{display:flex;align-items:center;gap:8px;border:1px solid #eceef2;background:#fafbfc;border-radius:11px;padding:9px;font-size:12px}.dot{width:18px;height:18px;border-radius:50%;background:#e9f7ef;color:#149550;display:grid;place-items:center;font-size:11px;font-weight:900}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{background:#fafbfc;border:1px solid #eef0f3;border-radius:12px;padding:10px}.metric .v{font-size:18px;font-weight:900}.metric .k{font-size:10px;color:#9298a2;margin-top:3px}.result{padding:11px 12px;border-bottom:1px solid #f0f1f4}.result:last-child{border-bottom:0}.rTop{display:grid;grid-template-columns:1.25fr .8fr .8fr;align-items:center;gap:8px}.name{font-size:15px;font-weight:900}.code{font-size:10px;color:#989da6}.score{font-size:19px;font-weight:900;text-align:right}.score.good{color:#d93025}.score.mid{color:#e08a00}.score.low{color:#777}.price{text-align:right;font-weight:800}.up{color:#d93025}.down{color:#159447}.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.chip{font-size:10px;padding:4px 7px;border-radius:999px;background:#f2f3f5;color:#5c626b}.chip.ok{background:#eaf8ef;color:#178346}.chip.warn{background:#fff4df;color:#a66000}.chip.bad{background:#fdecec;color:#c8332b}.reason{margin-top:8px;font-size:11px;color:#5d636d;line-height:1.55}.action{margin-top:8px;padding:8px 10px;border-radius:9px;font-size:12px;font-weight:800}.action.buy{background:#fdecec;color:#c72d26}.action.wait{background:#fff5df;color:#9b6500}.action.no{background:#f1f2f4;color:#676d76}.detail{display:none}.detail.show{display:block}.detailTop{padding:14px}.detailPrice{font-size:30px;font-weight:900;margin:6px 0}.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:10px}.kv div{display:flex;justify-content:space-between;font-size:11px;border-bottom:1px dashed #eceef2;padding:5px 0}.chartBox{padding:12px 14px 14px}.chartTabs{display:flex;gap:16px;font-size:12px;color:#9298a2;margin-bottom:8px}.chartTabs b{color:#17191d;border-bottom:2px solid #17191d;padding-bottom:5px}canvas{display:block;width:100%;height:250px;border:1px solid #eef0f3;border-radius:10px;background:#fff}.empty{text-align:center;color:#9ca1aa;font-size:12px;padding:28px 12px}.status{display:flex;justify-content:space-between;gap:8px;margin-top:9px;font-size:10px;color:#999ea7}.nav{position:fixed;bottom:0;left:0;right:0;height:68px;background:rgba(255,255,255,.96);border-top:1px solid #e8eaee;display:grid;grid-template-columns:repeat(4,1fr);z-index:40;backdrop-filter:blur(10px)}.nav div{display:grid;place-items:center;align-content:center;gap:3px;font-size:10px;color:#8a9099}.nav .on{color:#17191d;font-weight:800}.loader{padding:22px;text-align:center;color:#8f949d;font-size:12px}@media(max-width:390px){.strategyGrid{grid-template-columns:1fr}.summary{grid-template-columns:repeat(3,1fr)}.title{font-size:21px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><div><div class="title">超短猎手 4.0</div><div class="sub">缩量调整结束 · 站回10日线 · 尾盘资金确认</div></div><span id="sourceBadge" class="badge">东方财富行情</span></div>
    <div class="tabs"><div class="tab on">候选扫描</div><div class="tab">尾盘确认</div><div class="tab">风险过滤</div><div class="tab">个股详情</div></div>
  </div>
  <div class="wrap">
    <div class="card">
      <div class="cardHead"><b>输入候选股票</b><span class="sub">最多 30 只</span></div>
      <div class="body">
        <textarea id="stocks" class="input" placeholder="每行一只：股票名称或6位代码\n例如：常山北明\n粤传媒\n000716"></textarea>
        <div class="row" style="margin-top:10px"><button class="primary" id="scanBtn" onclick="scan(false)">开始实时扫描</button><button class="ghost" onclick="clearAll()">清空</button></div>
        <div class="status"><span id="statusText">等待扫描</span><span id="lastTime">--</span></div>
      </div>
    </div>

    <div class="card">
      <div class="cardHead"><b>你的超短策略</b><span class="sub">自动评分</span></div>
      <div class="body strategyGrid">
        <div class="rule"><span class="dot">✓</span>重新站上 MA10</div>
        <div class="rule"><span class="dot">✓</span>较前一日缩量</div>
        <div class="rule"><span class="dot">✓</span>换手率 3%–12%</div>
        <div class="rule"><span class="dot">✓</span>主力资金净流入</div>
        <div class="rule"><span class="dot">✓</span>涨跌幅 -2%–+6%</div>
        <div class="rule"><span class="dot">✓</span>规避 ST / 大市值 / A杀结构</div>
      </div>
    </div>

    <div class="card">
      <div class="cardHead"><b>扫描概况</b><span class="sub" id="countText">尚未扫描</span></div>
      <div class="body summary">
        <div class="metric"><div class="v" id="mGood">0</div><div class="k">重点观察</div></div>
        <div class="metric"><div class="v" id="mWait">0</div><div class="k">继续等待</div></div>
        <div class="metric"><div class="v" id="mRisk">0</div><div class="k">风险过滤</div></div>
      </div>
    </div>

    <div class="card">
      <div class="cardHead"><b>候选排名</b><span class="sub">按策略分排序</span></div>
      <div id="results"><div class="empty">输入候选股票后开始扫描</div></div>
    </div>

    <div class="card detail" id="detail">
      <div class="cardHead"><b id="dTitle">个股详情</b><button class="ghost" style="padding:6px 9px" onclick="closeDetail()">关闭</button></div>
      <div class="detailTop"><div id="dTags" class="chips"></div><div id="dPrice" class="detailPrice">--</div><div id="dAction" class="action wait">--</div><div id="dKv" class="kv"></div></div>
      <div class="chartBox"><div class="chartTabs"><b>日K</b><span>MA5</span><span>MA10</span><span>成交量</span></div><canvas id="kline" width="900" height="500"></canvas></div>
    </div>
  </div>
  <div class="nav"><div class="on">⌂<span>扫描</span></div><div>★<span>自选</span></div><div>▥<span>行情</span></div><div>⚙<span>设置</span></div></div>
</div>
<script>
const pending={};let timer=null,lastData=[];
window.__nativeResult=(id,text)=>{const p=pending[id];if(!p)return;delete pending[id];text.startsWith('__ERROR__')?p.reject(new Error(text.slice(9))):p.resolve(text)};
function nativeGet(url){return new Promise((resolve,reject)=>{if(!window.NativeMarket){reject(new Error('原生行情模块不可用'));return}const id='r'+Date.now()+Math.random().toString(36).slice(2);pending[id]={resolve,reject};NativeMarket.get(id,url);setTimeout(()=>{if(pending[id]){delete pending[id];reject(new Error('请求超时'))}},18000)})}
async function getJson(url){return JSON.parse(await nativeGet(url))}
function secid(code){return (/^(6|68)/.test(code)?'1.':'0.')+code}
async function resolveStock(q){q=q.trim();if(/^\d{6}$/.test(q))return{code:q,secid:secid(q)};const u='https://searchapi.eastmoney.com/api/suggest/get?input='+encodeURIComponent(q)+'&type=14&token=D43BF722C8E33BDC906FB84D85E326E8';const j=await getJson(u),a=j?.QuotationCodeTable?.Data||[];const x=a.find(v=>/^\d{6}$/.test(v.Code||'')&&['0','1'].includes(String(v.MktNum)))||a[0];if(!x)throw new Error('未找到股票');return{code:x.Code,secid:(String(x.MktNum)==='1'?'1.':'0.')+x.Code}}
function val(v,div=1){v=Number(v);return Number.isFinite(v)?v/div:null}function fmt(v,d=2){return v==null?'--':Number(v).toFixed(d)}function money(v){if(v==null)return'--';const a=Math.abs(v);if(a>=1e8)return(v/1e8).toFixed(2)+'亿';if(a>=1e4)return(v/1e4).toFixed(0)+'万';return Math.round(v)+''}
function marketProgress(){const p=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Shanghai',hour12:false,hour:'2-digit',minute:'2-digit',weekday:'short'}).formatToParts(new Date());let h=0,m=0,w='';for(const x of p){if(x.type==='hour')h=+x.value;if(x.type==='minute')m=+x.value;if(x.type==='weekday')w=x.value}if(w==='Sat'||w==='Sun')return 1;const t=h*60+m;if(t<570)return 0;if(t<=690)return(t-570)/240;if(t<780)return .5;if(t<=900)return(120+t-780)/240;return 1}
function riskStructure(lines,price,ma10){if(lines.length<6)return false;const x=lines.slice(-5),peak=Math.max(...x.map(k=>k.high)),drop=(peak-price)/peak*100,red=x.filter(k=>k.pct<-5).length;return drop>12||red>=2||price<ma10*.94}
function scoreStock(s){let score=0;const why=[];if(s.above){score+=25;why.push('站上MA10 +25')}else why.push('未站MA10');if(s.shrink===true){score+=20;why.push('缩量 +20')}else if(s.shrink===false)why.push('未缩量');if(s.turn>=3&&s.turn<=12){score+=15;why.push('换手健康 +15')}else why.push('换手不理想');if(s.main>0){score+=20;why.push('主力净流入 +20')}else why.push('主力未流入');if(s.pct>=-2&&s.pct<=6){score+=10;why.push('涨幅区间 +10')}if(s.price>=s.ma5){score+=5;why.push('站MA5 +5')}if(s.mainRatio!=null&&s.mainRatio>3){score+=5;why.push('主力占比强 +5')}if(s.riskST)score-=40;if(s.riskCap)score-=10;if(s.riskA)score-=30;return{score:Math.max(0,Math.min(100,score)),why}}
async function analyze(q){const r=await resolveStock(q);const quote='https://push2.eastmoney.com/api/qt/stock/get?secid='+r.secid+'&fields=f43,f44,f45,f46,f47,f48,f57,f58,f60,f62,f86,f116,f117,f168,f170,f184';const kl='https://push2his.eastmoney.com/api/qt/stock/kline/get?secid='+r.secid+'&klt=101&fqt=1&lmt=60&end=20500101&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61';const [qj,kj]=await Promise.all([getJson(quote),getJson(kl)]);const d=qj?.data;if(!d)throw new Error('行情为空');const lines=(kj?.data?.klines||[]).map(t=>{const a=t.split(',');return{date:a[0],open:+a[1],close:+a[2],high:+a[3],low:+a[4],vol:+a[5],amount:+a[6],pct:+a[8],turn:+a[10]}}).filter(x=>Number.isFinite(x.close));if(lines.length<12)throw new Error('K线不足');const price=val(d.f43,100),pct=val(d.f170,100),turn=val(d.f168,100),main=val(d.f62),mainRatio=val(d.f184,100),amount=val(d.f48),totalCap=val(d.f116),floatCap=val(d.f117),curVol=val(d.f47);const ma10=lines.slice(-10).reduce((a,b)=>a+b.close,0)/10,ma5=lines.slice(-5).reduce((a,b)=>a+b.close,0)/5,prev=lines.at(-2)||lines.at(-1),prog=marketProgress();const vr=prog>0&&curVol&&prev?.vol?curVol/(prev.vol*Math.max(.18,prog)):null,shrink=vr==null?null:vr<.92,above=price>=ma10,name=d.f58||q,riskST=/ST|退/.test(name),riskCap=totalCap!=null&&totalCap>8e10,riskA=riskStructure(lines,price,ma10);const s={q,name,code:d.f57||r.code,price,pct,turn,main,mainRatio,amount,totalCap,floatCap,ma5,ma10,above,shrink,vr,lines,riskST,riskCap,riskA,time:d.f86?new Date(d.f86*1000):new Date()};Object.assign(s,scoreStock(s));s.hardRisk=riskST||riskA;s.action=s.hardRisk?'风险过滤':(s.score>=75&&above&&shrink===true&&main>0?'尾盘重点观察':s.score>=55?'继续等待确认':'暂不考虑');return s}
function chip(text,type=''){return '<span class="chip '+type+'">'+text+'</span>'}
function render(){const box=document.getElementById('results');lastData.sort((a,b)=>b.score-a.score);let good=0,wait=0,risk=0;if(!lastData.length){box.innerHTML='<div class="empty">暂无有效行情</div>';return}box.innerHTML=lastData.map((s,i)=>{if(s.hardRisk)risk++;else if(s.score>=75)good++;else wait++;const sc=s.score>=75?'good':s.score>=55?'mid':'low',pc=s.pct>=0?'up':'down',ac=s.hardRisk?'no':s.score>=75?'buy':'wait';return '<div class="result" onclick="showDetail('+i+')"><div class="rTop"><div><div class="name">'+s.name+'</div><div class="code">'+s.code+'</div></div><div class="price '+pc+'">'+fmt(s.price)+'<br><span class="sub">'+(s.pct>=0?'+':'')+fmt(s.pct)+'%</span></div><div class="score '+sc+'">'+s.score+'<div class="sub">策略分</div></div></div><div class="chips">'+chip(s.above?'站上MA10':'未站MA10',s.above?'ok':'bad')+chip(s.shrink===true?'缩量':'量能待确认',s.shrink===true?'ok':'warn')+chip('换手 '+fmt(s.turn,1)+'%',s.turn>=3&&s.turn<=12?'ok':'warn')+chip(s.main>0?'主力流入 '+money(s.main):'主力流出 '+money(s.main),s.main>0?'ok':'bad')+(s.riskA?chip('A杀风险','bad'):'')+(s.riskCap?chip('市值偏大','warn'):'')+'</div><div class="reason">'+s.why.slice(0,4).join(' · ')+'</div><div class="action '+ac+'">'+s.action+'</div></div>'}).join('');document.getElementById('mGood').textContent=good;document.getElementById('mWait').textContent=wait;document.getElementById('mRisk').textContent=risk;document.getElementById('countText').textContent='成功 '+lastData.length+' 只'}
async function scan(auto){const raw=document.getElementById('stocks').value.split(/[\n,，;；]+/).map(x=>x.trim()).filter(Boolean).slice(0,30);if(!raw.length){document.getElementById('statusText').textContent='请先输入候选股票';return}localStorage.setItem('shortHunterStocks',raw.join('\n'));const btn=document.getElementById('scanBtn');btn.disabled=true;btn.textContent=auto?'自动刷新中…':'扫描中…';document.getElementById('results').innerHTML='<div class="loader">正在读取实时行情、K线与资金数据…</div>';const arr=[];for(let i=0;i<raw.length;i+=5){const chunk=raw.slice(i,i+5);const got=await Promise.all(chunk.map(async q=>{try{return await analyze(q)}catch(e){return null}}));arr.push(...got.filter(Boolean));document.getElementById('statusText').textContent='已完成 '+Math.min(i+5,raw.length)+' / '+raw.length}lastData=arr;render();const now=new Date();document.getElementById('lastTime').textContent=now.toLocaleTimeString();document.getElementById('statusText').textContent='数据源：东方财富公开行情接口';btn.disabled=false;btn.textContent='开始实时扫描';clearInterval(timer);timer=setInterval(()=>scan(true),60000)}
function showDetail(i){const s=lastData[i];if(!s)return;document.getElementById('detail').classList.add('show');document.getElementById('dTitle').textContent=s.name+' '+s.code;document.getElementById('dPrice').innerHTML='<span class="'+(s.pct>=0?'up':'down')+'">'+fmt(s.price)+' <small style="font-size:14px">'+(s.pct>=0?'+':'')+fmt(s.pct)+'%</small></span>';document.getElementById('dTags').innerHTML=chip('策略分 '+s.score,s.score>=75?'ok':'warn')+chip(s.above?'站上MA10':'未站MA10',s.above?'ok':'bad')+chip(s.shrink===true?'缩量':'量能待确认',s.shrink===true?'ok':'warn');const ac=s.hardRisk?'no':s.score>=75?'buy':'wait';const da=document.getElementById('dAction');da.className='action '+ac;da.textContent=s.action;document.getElementById('dKv').innerHTML=[['MA5',fmt(s.ma5)],['MA10',fmt(s.ma10)],['换手率',fmt(s.turn,2)+'%'],['量比估算',fmt(s.vr,2)],['主力净额',money(s.main)],['主力占比',fmt(s.mainRatio,2)+'%'],['成交额',money(s.amount)],['总市值',money(s.totalCap)]].map(x=>'<div><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('');drawK(s.lines,s.ma5,s.ma10);document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'start'})}
function closeDetail(){document.getElementById('detail').classList.remove('show')}
function drawK(lines){const c=document.getElementById('kline'),ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);const xs=lines.slice(-30),pad=42,volH=105,priceH=h-volH-pad,min=Math.min(...xs.map(x=>x.low)),max=Math.max(...xs.map(x=>x.high)),vr=Math.max(...xs.map(x=>x.vol))||1,sx=(w-pad*2)/xs.length,py=v=>pad+(max-v)/(max-min||1)*(priceH-pad);ctx.strokeStyle='#eef0f3';ctx.lineWidth=1;for(let i=0;i<5;i++){const y=pad+i*(priceH-pad)/4;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-pad,y);ctx.stroke()}xs.forEach((x,i)=>{const cx=pad+i*sx+sx/2,up=x.close>=x.open;ctx.strokeStyle=up?'#d93025':'#159447';ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx,py(x.high));ctx.lineTo(cx,py(x.low));ctx.stroke();const y1=py(Math.max(x.open,x.close)),y2=py(Math.min(x.open,x.close));ctx.fillRect(cx-sx*.28,y1,Math.max(2,sx*.56),Math.max(2,y2-y1));const vh=x.vol/vr*(volH-25),vy=h-vh-18;ctx.globalAlpha=.45;ctx.fillRect(cx-sx*.28,vy,Math.max(2,sx*.56),vh);ctx.globalAlpha=1});function ma(n,color){ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();let started=false;xs.forEach((_,i)=>{const g=lines.length-xs.length+i;if(g<n-1)return;let a=0;for(let j=g-n+1;j<=g;j++)a+=lines[j].close;const y=py(a/n),x=pad+i*sx+sx/2;if(!started){ctx.moveTo(x,y);started=true}else ctx.lineTo(x,y)});ctx.stroke()}ma(5,'#e39a1a');ma(10,'#2468d8')}
function clearAll(){document.getElementById('stocks').value='';localStorage.removeItem('shortHunterStocks');lastData=[];render();document.getElementById('mGood').textContent='0';document.getElementById('mWait').textContent='0';document.getElementById('mRisk').textContent='0'}
window.addEventListener('load',()=>{document.getElementById('stocks').value=localStorage.getItem('shortHunterStocks')||''});
</script>
</body></html>
