name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ShortHunter.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShortHunter-Android
          path: ShortHunter.apk
          retention-days: 30
