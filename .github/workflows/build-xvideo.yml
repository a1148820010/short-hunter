name: Build X Video APK
on:
  push:
    branches: [ main ]
    paths:
      - 'xvideo/**'
      - 'settings.gradle'
      - '.github/workflows/build-xvideo.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build X Video APK
        run: gradle :xvideo:assembleRelease
      - name: Rename APK
        run: cp xvideo/build/outputs/apk/release/xvideo-release.apk X-Video.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: X-Video-Android
          path: X-Video.apk
          retention-days: 30
