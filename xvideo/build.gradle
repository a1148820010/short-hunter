plugins { id 'com.android.application' }

android {
    namespace 'com.xvideo.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.xvideo.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
